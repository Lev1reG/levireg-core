services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: levireg
      POSTGRES_PASSWORD: levireg
      POSTGRES_DB: levireg
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U levireg"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
