openapi: 3.1.0
info:
  title: levireg-core
  version: 1.0.0
  description: Backend API for the personal website. Every /api/v1 response uses the envelope; clients branch on `code`.
servers:
  - url: /
paths:
  /healthz:
    get:
      summary: Liveness probe
      operationId: healthz
      tags: [Probes]
      responses:
        "200":
          description: Process is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeStatus" }
  /readyz:
    get:
      summary: Readiness probe
      operationId: readyz
      tags: [Probes]
      responses:
        "200":
          description: Database reachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeStatus" }
        "503":
          description: Database unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeStatus" }
  /api/v1/auth/login:
    post:
      summary: Sign in and create a Session
      description: Rate limited to 5 requests per minute per client IP.
      operationId: login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: "Code `ok`."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [token, expires_at, user]
                        properties:
                          token: { type: string }
                          expires_at: { type: string, format: date-time }
                          user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "Code `invalid_credentials`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "403":
          description: "Code `user_pending`: correct password, but the User is not yet approved. No Session is created."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429":
          description: "Code `rate_limited`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/auth/logout:
    post:
      summary: End the current Session
      operationId: logout
      tags: [Auth]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: "Code `ok`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/auth/me:
    get:
      summary: Current User
      operationId: me
      tags: [Auth]
      security: [{ bearer: [] }]
      responses:
        "200":
          description: "Code `ok`."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/auth/register:
    post:
      summary: Register as a Pending User
      description: Public Registration; always creates a Member and ignores any `role`. The User cannot sign in until a Superadmin approves. Rate limited to 3 requests per minute per client IP.
      operationId: register
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, name, password]
              properties:
                username: { type: string, pattern: "^[a-z0-9_]{3,32}$" }
                email: { type: string, format: email }
                name: { type: string }
                password: { type: string, minLength: 8, maxLength: 256 }
      responses:
        "201":
          description: "Code `ok`; `approved_at` is null."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: "Code `username_taken` or `email_taken`, including against Pending Users."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429":
          description: "Code `rate_limited`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/users:
    post:
      summary: Create an Approved User (Superadmin only)
      operationId: createUser
      tags: [Users]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, name, password]
              properties:
                username: { type: string, pattern: "^[a-z0-9_]{3,32}$" }
                email: { type: string, format: email }
                name: { type: string }
                password: { type: string, minLength: 8, maxLength: 256 }
                role: { type: string, enum: [superadmin, member], default: member }
      responses:
        "201":
          description: "Code `ok`; the User can sign in at once."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "Code `username_taken` or `email_taken`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      summary: List Users (Superadmin only)
      description: Ordered `created_at DESC, username ASC`. A `page` past the end returns an empty `data` array and the correct `total`.
      operationId: listUsers
      tags: [Users]
      security: [{ bearer: [] }]
      parameters:
        - name: status
          in: query
          description: Omit for all Users.
          schema: { type: string, enum: [pending, approved] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: "Code `ok`, with Pagination `meta`."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    required: [data, meta]
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/users/{username}/approve:
    post:
      summary: Approve a Pending User (Superadmin only)
      operationId: approveUser
      tags: [Users]
      security: [{ bearer: [] }]
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "Code `ok` with the Approved User."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "Code `user_not_found`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "409":
          description: "Code `user_not_pending`: the User is already approved."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/users/{username}/reject:
    post:
      summary: Reject a Pending User (Superadmin only)
      operationId: rejectUser
      tags: [Users]
      security: [{ bearer: [] }]
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "Code `ok`, no payload. The User is deleted; the username and email become free."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "Code `user_not_found`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "409":
          description: "Code `user_not_pending`: the User is already approved."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "500": { $ref: "#/components/responses/InternalError" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Session token from `POST /api/v1/auth/login`.
  schemas:
    Code:
      type: string
      description: Stable outcome identifier. Must match the Code* constants in internal/handler/response.go.
      enum:
        - ok
        - unauthorized
        - forbidden
        - internal_error
        - validation_failed
        - invalid_credentials
        - bad_request
        - username_taken
        - email_taken
        - rate_limited
        - user_pending
        - user_not_pending
        - user_not_found
    Envelope:
      type: object
      required: [code]
      properties:
        code: { $ref: "#/components/schemas/Code" }
        message: { type: string }
        data: {}
        errors:
          type: object
          description: Field errors, keyed by request field.
          additionalProperties: { type: string }
        meta: { $ref: "#/components/schemas/Meta" }
    Meta:
      type: object
      description: Pagination meta, present only on list responses.
      required: [page, per_page, total]
      properties:
        page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0, description: Number of items matching the query across all pages. }
    ProbeStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, unavailable] }
    User:
      type: object
      required: [username, email, name, role, created_at, approved_at]
      properties:
        username: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [superadmin, member] }
        created_at: { type: string, format: date-time }
        approved_at: { type: [string, "null"], format: date-time, description: Null for a Pending User. }
  responses:
    Forbidden:
      description: "Code `forbidden`: caller is not a Superadmin."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    BadRequest:
      description: "Code `bad_request`: body is not valid JSON."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    Unauthorized:
      description: "Code `unauthorized`: missing or invalid token."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    ValidationFailed:
      description: "Code `validation_failed`; `errors` holds the Field errors."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    InternalError:
      description: "Code `internal_error`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
